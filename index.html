<script>
    // RFC 4180 표준 지원 정밀 CSV 파서 (따옴표 내 구분자 및 쌍따옴표 이스케이프 완벽 보존)
    function parseCSVLine(line) {
      const result = [];
      let cur = '';
      let inQuotes = false;
      
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') {
          if (inQuotes && line[i + 1] === '"') {
            cur += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (!inQuotes && (c === ',' || c === ';' || c === '\t' || c === '|')) {
          result.push(cur.trim().replace(/^"(.*)"$/, '$1'));
          cur = '';
        } else {
          cur += c;
        }
      }
      result.push(cur.trim().replace(/^"(.*)"$/, '$1'));
      return result;
    }

    function convert() {
      const input = document.getElementById('input').value;
      if (!input.trim()) {
        document.getElementById('output').value = '';
        return;
      }
      const rows = input.trim().split(/\r?\n/);
      const flat = rows.flatMap(row => parseCSVLine(row));
      const cleaned = flat.map(cell => cell.trim()).filter(cell => cell !== '');
      document.getElementById('output').value = cleaned.join('\n');
      if (window.showToastNotification) {
        showToastNotification(`총 ${cleaned.length}개의 데이터가 1열로 변환되었습니다!`);
      }
    }

    function copyResult() {
      const output = document.getElementById('output');
      const val = output.value.trim();
      if (!val) {
        if (window.showToastNotification) showToastNotification('변환된 데이터가 없습니다.');
        return;
      }
      
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(val).then(() => {
          if (window.showToastNotification) showToastNotification('결과가 클립보드에 복사되었습니다! 🎉');
        }).catch(() => fallbackCopy(output));
      } else {
        fallbackCopy(output);
      }
      if (window.navigator && window.navigator.vibrate) window.navigator.vibrate(60);
    }

    function fallbackCopy(el) {
      el.select();
      el.setSelectionRange(0, 99999);
      document.execCommand('copy');
      el.blur();
      if (window.showToastNotification) showToastNotification('결과가 클립보드에 복사되었습니다! 🎉');
    }
  </script>
<!-- Preemptive UX Helper: Auto comma formatting & Result sharing -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
      // Auto comma on number/text inputs with currency hints
      const moneyInputs = document.querySelectorAll('input[type="text"], input[type="number"], input[inputmode="numeric"]');
      moneyInputs.forEach(input => {
        // Skip specific inputs like year, month, date, percent, id
        const name = (input.name || input.id || '').toLowerCase();
        if (name.includes('year') || name.includes('month') || name.includes('day') || name.includes('rate') || name.includes('percent') || name.includes('age') || name.includes('score')) {
          return;
        }
        
        // Listen to input
        input.addEventListener('input', function(e) {
          if (this.type === 'number') return; // native number handles own UI
          let val = this.value.replace(/[^0-9]/g, '');
          if (val) {
            this.value = Number(val).toLocaleString('ko-KR');
          }
        });
      });

      // Inject Global Result Copy Function if not exists
      window.copyResultToClipboard = function(textToCopy, customBtn) {
        if (!textToCopy) {
          const resEl = document.querySelector('#result, .result-box, [id*="result"], [class*="result"]');
          textToCopy = resEl ? resEl.innerText.trim() : window.location.href;
        }
        navigator.clipboard.writeText(textToCopy + "\n\n👉 계산기 바로가기: " + window.location.href).then(() => {
          showToastNotification('계산 결과가 클립보드에 복사되었습니다!');
        }).catch(() => {
          showToastNotification('복사되었습니다: ' + window.location.href);
        });
      };

      window.showToastNotification = function(msg) {
        let toast = document.getElementById('global-ux-toast');
        if (!toast) {
          toast = document.createElement('div');
          toast.id = 'global-ux-toast';
          toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 24px;border-radius:9999px;font-size:14px;font-weight:600;box-shadow:0 10px 25px rgba(0,0,0,0.2);z-index:9999;transition:all 0.3s ease;opacity:0;pointer-events:none;';
          document.body.appendChild(toast);
        }
        toast.textContent = msg;
        toast.style.opacity = '1';
        toast.style.transform = 'translateX(-50%) translateY(0)';
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateX(-50%) translateY(10px)';
        }, 2200);
      }
    });
  </script>
